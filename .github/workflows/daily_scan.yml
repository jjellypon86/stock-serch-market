name: Daily Scan

on:
  schedule:
    - cron: '0 7 * * 1-5'   # 평일 UTC 07:00 = KST 16:00 (정규장 마감 15:30 이후)
  workflow_dispatch: {}      # Actions 탭에서 수동 실행 버튼

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write Streamlit secrets
        env:
          SECRETS_TOML: ${{ secrets.STREAMLIT_SECRETS_TOML }}
        run: |
          mkdir -p .streamlit
          printf '%s' "$SECRETS_TOML" > .streamlit/secrets.toml

      - name: Run daily scan
        run: python scripts/daily_scan.py
