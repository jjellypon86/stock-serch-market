name: Daily Scan

on:
  schedule:
    # GitHub schedule은 지연·누락이 잦아 백업 cron을 여러 개 둠 (중복 저장은 save_scan_results가 스킵)
    - cron: '23 7 * * 1-5'   # 평일 UTC 07:23 = KST 16:23 (정규장 마감 15:30 이후, 정각 혼잡 회피)
    - cron: '47 9 * * 1-5'   # 백업 1: KST 18:47
    - cron: '17 12 * * 1-5'  # 백업 2: KST 21:17
  workflow_dispatch: {}      # Actions 탭에서 수동 실행 버튼

permissions:
  contents: read
  issues: write            # 스캔 실패 시 Issue로 알림

# 같은 스캔이 동시에 돌아 시트에 중복 저장되는 것을 방지
concurrency:
  group: daily-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-24.04    # ubuntu-latest가 Ubuntu 26으로 전환되어 버전 고정
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write Streamlit secrets
        env:
          SECRETS_TOML: ${{ secrets.STREAMLIT_SECRETS_TOML }}
        run: |
          mkdir -p .streamlit
          printf '%s' "$SECRETS_TOML" > .streamlit/secrets.toml

      - name: Run daily scan
        run: python scripts/daily_scan.py

      - name: Notify on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create --repo "${{ github.repository }}" \
            --title "⚠️ 자동 스캔 실패 $(TZ=Asia/Seoul date +%Y-%m-%d)" \
            --body "@jjellypon86 Daily Scan 실행이 실패했습니다. 로그: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
