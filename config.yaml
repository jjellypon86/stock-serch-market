# K-Quant 전략 상수 관리
# 각 모듈에서 yaml.safe_load()로 로드하여 사용

strategy:
  version: "v4"   # 파라미터 변경 시 수동으로 올림 (v1: 구 전략, v2: 2026-05-13~, v3: 2026-10-13~, v4: 2026-10-28~)
  # v3 변경 사유: v2만 분리한 실매매 13건 승률 15.4%(backtest 19.1%)로 손익분기 33.3% 대비 크게 미달.
  # 141건 백테스트의 "20일 고점대비 하락률" 구간별 WIN율 분석 결과 -5~-10.7%(얕은 눌림, 전체의 절반)가
  # 14.5%로 최악, -10.7~-22.1%(깊은 눌림) 구간이 31~33%로 확연히 우수해 drawdown 밴드를 신설.
  # ATR 기반 손절이 고변동성 종목에서 과도하게 넓어지는 문제 보완을 위해 max_loss_pct 상한도 추가.
  # v4 변경 사유: v3 실매매 10건 0승 10패(2026-10-28). 익절이 ATR×2(약 +13%)로 5거래일 내 도달이 어려워
  # 익절 퍼센트 상한(max_profit_pct 8%)을 추가. 손익분기 승률은 약 28% → 약 38%로 올라가므로 백테스트로 검증 필요.
  # 효과가 없으면 max_profit_pct를 null로 두고 버전을 되돌릴 것.

market:
  min_market_cap: 100_000_000_000   # 시가총액 하한 (1000억)
  day_min_trade:  5_000_000_000     # 단기 거래대금 하한 (50억)
  swing_min_trade: 10_000_000_000   # 스윙 거래대금 하한 (100억)

scanner:
  pullback_band: 0.021              # MA 기준 눌림 허용 범위 ±2.1% (3% → 2.1%, WIN 최고 구간 기준)
  vol_decay_ratio: 0.70             # 거래량 감소 임계값 (직전 평균 대비)

  day:
    tp_mult: 2.0                    # 익절 배수 (ATR × n)
    sl_mult: 1.0                    # 손절 배수 (ATR × n)
    max_loss_pct: 0.05              # 손절 퍼센트 상한 — ATR 기반 폭이 이보다 넓으면 이 값으로 제한
    max_profit_pct: 0.08            # 익절 퍼센트 상한 — ATR 기반 폭이 이보다 넓으면 이 값으로 제한 (null이면 상한 없음)
    lookback_days: 150              # OHLCV 조회 기간 (MA60 확보)
    down_days_min: 2                # 눌림 인정 하락일 수
    pullback_window: 3              # 눌림 거래량 비교 구간 (일)
    supply_min: 3                   # 수급 합산 최소일수 (기관+외국인 순매수일 합계)
    drawdown_min: -22.0             # 20일 고점대비 하락률 하한(%) — 이보다 깊으면 추세붕괴로 간주해 제외
    drawdown_max: -10.0             # 20일 고점대비 하락률 상한(%) — 이보다 얕으면(5~10.7%) WIN율 최저 구간이라 제외

  swing:
    tp_mult: 3.0
    sl_mult: 1.5
    max_loss_pct: 0.07              # 손절 퍼센트 상한
    lookback_days: 250              # OHLCV 조회 기간 (MA120 확보)
    down_days_min: 3
    pullback_window: 5
    supply_min: 3                   # 수급 합산 최소일수

rsi:
  period: 14
  score_high_low: 40               # 고점수 구간 하한 (40~55 → 10점)
  score_high_high: 55
  score_mid_low: 30                # 중점수 구간 하한 (30~40 → 5점)
  score_mid_high: 40

weights:
  supply: 43        # 수급 (기관+외국인 순매수일) — 30→43, 상관계수 0.247 최고
  risk_reward: 25   # 손익비
  pullback: 23      # 눌림률 — 15→23, WIN이 더 얕은 눌림 확인
  trend_quality: 24 # 추세 품질 (거래량 연속 감소) — 20→24
  rsi_score: 10     # RSI 구간 점수

backtest:
  day_max_hold: 5
  swing_max_hold: 10
  min_market_cap: 30_000_000_000
  sample_size: 200
  slippage: 0.001                  # 매수 슬리피지 0.1%
  ignore_profit_cap: true          # (임시) true면 백테스트에서 익절 상한 무시 — v3/v4 동일 기간 비교용, 비교 후 false로 복구

fees:
  commission: 0.00015              # 수수료 0.015%
  tax: 0.002                       # 증권거래세 0.2%
